<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#070c18" />
<title>واطنا — وضع دون اتصال</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #070c18; color: #e6edf7; padding: 1.5rem;
    font-family: system-ui, "Segoe UI", Tahoma, sans-serif; line-height: 1.9;
  }
  .box {
    max-width: 420px; text-align: center; background: #0d1527;
    border: 1px solid #1f3152; border-radius: 18px; padding: 2rem 1.5rem;
  }
  .bolt { font-size: 3rem; }
  h1 { font-size: 1.3rem; margin: .5rem 0; }
  p { color: #93a4c4; font-size: .95rem; }
  a {
    display: inline-block; margin-top: 1rem; padding: .7rem 1.4rem;
    background: linear-gradient(135deg, #f59e0b, #ea580c); color: #1a1000;
    border-radius: 999px; font-weight: 800; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="bolt">⚡</div>
    <h1>واطنا — الورشة دون اتصال 🧰</h1>
    <p>لا يوجد اتصال بالإنترنت، لكن أدواتك محفوظة على الجهاز. المختبر والمخططات والملفات تعمل محليًا.</p>
    <a href="/workbench/">🧪 فتح المختبر دون اتصال</a>
  </div>
</body>
</html>
